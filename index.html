<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Değerini Öğren</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0;padding:25px;text-align:center}
.box{max-width:500px;margin:auto;background:white;padding:25px;border-radius:20px}
h1{font-size:30px}
button{width:100%;padding:16px;margin-top:15px;border:0;border-radius:12px;background:#222;color:white;font-size:17px}
input{margin-top:20px;width:100%}
#sonuc{margin-top:20px;font-size:18px}
</style>
</head>
<body>
<div class="box">
<h1>🔎 Değerini Öğren</h1>
<p>Eşyanın fotoğrafını yükle, değerini öğrenmeye başla.</p>

<input type="file" accept="image/*">

<button onclick="deger()">Değerini Öğren</button>

<div id="sonuc"></div>
</div>

<script>
function deger(){
document.getElementById("sonuc").innerHTML=
"Fotoğraf alındı. Değer tahmini özelliği yakında aktif olacak.";
}
</script>
</body>
</html>
