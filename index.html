<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Değerini Öğren</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #6c4cff;
      color: white;
      padding: 45px 20px;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: 38px;
    }

    .box {
      width: 85%;
      max-width: 450px;
      margin: 35px auto;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    #photo {
      display: none;
    }

    .photo-button {
      display: block;
      background: #6c4cff;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }

    #preview {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
    }

    select, button {
      width: 100%;
      margin-top: 18px;
      padding: 15px;
      font-size: 17px;
      border-radius: 10px;
    }

    button {
      border: none;
      background: #6c4cff;
      color: white;
      font-weight: bold;
    }

    #result {
      margin-top: 20px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <header>
    <h1>💰 Değerini Öğren</h1>
    <p>Eşyanın fotoğrafını yükle, değerini araştırmaya başla.</p>
  </header>

  <div class="box">

    <label for="photo" class="photo-button">
      📷 Fotoğraf Seç
    </label>

    <input type="file" id="photo" accept="image/*">

    <img id="preview" alt="Seçilen fotoğraf">

    <select id="category">
      <option value="">Eşya türünü seç</option>
      <option>Elektronik</option>
      <option>Mobilya</option>
      <option>Giyim</option>
      <option>Takı</option>
      <option>Oyuncak</option>
      <option>Antika</option>
      <option>Ev eşyası</option>
      <option>Diğer</option>
    </select>

    <button onclick="showResult()">
      🔍 Değerini Araştır
    </button>

    <div id="result"></div>

  </div>

  <script>
    const photo = document.getElementById("photo");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");

    photo.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        preview.src = e.target.result;
        preview.style.display = "block";
        result.innerHTML = "✅ Fotoğraf seçildi.";
      };

      reader.readAsDataURL(file);
    });

    function showResult() {
      const category = document.getElementById("category").value;

      if (!photo.files.length) {
        result.innerHTML = "📷 Önce fotoğraf seç.";
        return;
      }

      if (!category) {
        result.innerHTML = "📦 Eşya türünü seç.";
        return;
      }

      result.innerHTML =
        "✅ Fotoğraf hazır.<br>" +
        "Kategori: <b>" + category + "</b>";
    }
  </script>

</body>
</html>
