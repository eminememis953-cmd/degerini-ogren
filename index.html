<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Değerini Öğren</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  text-align: center;
}

header {
  background: #6c4cff;
  color: white;
  padding: 45px 20px;
}

header h1 {
  margin: 0 0 15px;
  font-size: 38px;
}

header p {
  font-size: 18px;
  line-height: 1.4;
}

.box {
  width: 92%;
  max-width: 500px;
  margin: 35px auto;
  padding: 25px;
  background: white;
  border-radius: 22px;
  box-shadow: 0 7px 20px rgba(0,0,0,0.15);
}

#photo {
  display: none;
}

.photo-button {
  display: block;
  width: 100%;
  padding: 18px;
  background: #6c4cff;
  color: white;
  border-radius: 14px;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

#preview {
  display: none;
  width: 100%;
  max-height: 500px;
  object-fit: contain;
  margin-top: 20px;
  border-radius: 15px;
}

select {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  font-size: 18px;
  border: 2px solid #333;
  border-radius: 12px;
  background: white;
}

#researchButton {
  width: 100%;
  margin-top: 20px;
  padding: 18px;
  border: none;
  border-radius: 14px;
  background: #6c4cff;
  color: white;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
}

#researchButton:active {
  transform: scale(0.98);
}

#result {
  margin-top: 22px;
  padding: 10px;
  font-size: 18px;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>
  <h1>💰 Değerini Öğren</h1>
  <p>Eşyanın fotoğrafını yükle, değerini araştırmaya başla.</p>
</header>

<div class="box">

  <label for="photo" class="photo-button">
    📷 Fotoğraf Seç
  </label>

  <input
    type="file"
    id="photo"
    accept="image/*"
  >

  <img id="preview" alt="Seçilen fotoğraf">

  <select id="category">
    <option value="">Eşya türünü seç</option>
    <option value="Elektronik">Elektronik</option>
    <option value="Mobilya">Mobilya</option>
    <option value="Giyim">Giyim</option>
    <option value="Takı">Takı / Aksesuar</option>
    <option value="Oyuncak">Oyuncak</option>
    <option value="Antika">Antika</option>
    <option value="Ev eşyası">Ev eşyası</option>
    <option value="Diğer">Diğer</option>
  </select>

  <button id="researchButton" type="button">
    🔍 Değerini Araştır
  </button>

  <div id="result"></div>

</div>
