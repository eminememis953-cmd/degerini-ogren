<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Değerini Öğren</title>

<style>
body{
  margin:0;
  font-family:Arial;
  text-align:center;
  background:#f5f5f5;
}
header{
  background:#6c4cff;
  color:white;
  padding:35px 15px;
}
.box{
  margin:30px auto;
  padding:20px;
  width:85%;
  max-width:450px;
  background:white;
  border-radius:18px;
}
input{display:none;}

label,button{
  display:block;
  width:100%;
  padding:16px;
  margin-top:15px;
  background:#6c4cff;
  color:white;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
}

select{
  width:100%;
  padding:15px;
  margin-top:18px;
  font-size:17px;
}

img{
  display:none;
  width:100%;
  margin-top:18px;
  border-radius:12px;
}

#sonuc{
  margin-top:18px;
  font-size:17px;
}
</style>
</head>

<body>

<header>
<h1>💰 Değerini Öğren</h1>
<p>Eşyanın fotoğrafını yükle, değerini araştır.</p>
</header>

<div class="box">

<label for="foto">📷 Fotoğraf Seç</label>
<input id="foto" type="file" accept="image/*">

<img id="resim">

<select id="tur">
<option value="">Eşya türünü seç</option>
<option>Elektronik</option>
<option>Mobilya</option>
<option>Giyim</option>
<option>Takı</option>
<option>Oyuncak</option>
<option>Antika</option>
<option>Ev eşyası</option>
<option>Diğer</option>
</select>

<button id="ara">🔍 Değerini Araştır</button>

<div id="sonuc"></div>

</div>

<script>
const foto=document.getElementById("foto");
const resim=document.getElementById("resim");
const sonuc=document.getElementById("sonuc");

foto.onchange=()=>{
  if(!foto.files[0]) return;

  resim.src=URL.createObjectURL(foto.files[0]);
  resim.style.display="block";
  sonuc.innerHTML="✅ Fotoğraf seçildi.";
};

document.getElementById("ara").onclick=()=>{
  const tur=document.getElementById("tur").value;

  if(!foto.files.length){
    sonuc.innerHTML="📷 Önce fotoğraf seç.";
    return;
  }

  if(!tur){
    sonuc.innerHTML="📦 Önce eşya türünü seç.";
    return;
  }

  sonuc.innerHTML=
    "✅ "+tur+" seçildi.<br>🔎 Değer araştırması için hazır.";
};
document.getElementById("ara").onclick = async () => {
  const sonuc = document.getElementById("sonuc");
  sonuc.innerHTML = "🔎 Araştırılıyor...";

  try {
    const cevap = await fetch("/api");
    const veri = await cevap.json();
    sonuc.innerHTML = "✅ " + veri.message;
  } catch (hata) {
    sonuc.innerHTML = "❌ Araştırma sırasında hata oluştu.";
  }
};
  
</script>

</body>
</html>
